<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>五子棋</title>
  <script src="../config.js"></script>
  <script>if (window.SITE && window.SITE.online === false) location.replace('offline.html');</script>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <style>
    :root {
      --bg-1: #16213e;
      --bg-2: #1a1a2e;
      --bg-3: #0f0f1a;
      --board: #d9b27c;
      --board-dark: #b88649;
      --line: #5a3a1a;
      --star: #3a2410;
      --black: #1c1c1c;
      --white: #fafafa;
      --accent: #ff8a80;
      --btn: #0f3460;
      --btn-hover: #17417a;
      --text: #f2f4f8;
      --text-dim: rgba(242,244,248,.62);
      --card-bg: rgba(255,255,255,.06);
      --card-border: rgba(255,255,255,.14);
      --gold: #ffd700;
      --ready: #4ade80;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2) 65%, var(--bg-3));
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .app {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px 40px;
    }
    .top-bar { width: 100%; max-width: 600px; display: flex; margin-bottom: 6px; }
    .back-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--btn); color: #fff; text-decoration: none;
      font-size: 18px; line-height: 1; cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .back-btn:hover { background: var(--btn-hover); }
    .back-btn:active { transform: scale(.94); }
    h1 {
      margin: 0 0 4px; font-weight: 600; letter-spacing: 4px; font-size: 26px;
      color: var(--gold);
    }
    .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; }

    .panel {
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .turn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 999px;
      background: var(--card-bg); border: 1px solid var(--card-border);
      box-shadow: none;
      font-size: 14px; color: var(--text-dim);
    }
    .turn .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #555, #000 70%);
      box-shadow: inset 0 -2px 3px rgba(255,255,255,.2);
    }
    .turn.white .dot {
      background: radial-gradient(circle at 35% 30%, #fff, #ccc 80%);
    }
    .turn.win { background: rgba(255,215,0,.14); border-color: rgba(255,215,0,.4); color: var(--gold); font-weight: 600; }

    button {
      appearance: none; border: none; cursor: pointer;
      background: var(--btn); color: #fff;
      padding: 7px 16px; border-radius: 8px; font-size: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.3);
      transition: background .15s, transform .05s;
    }
    button:hover:not(:disabled) { background: var(--btn-hover); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { background: rgba(255,255,255,.12); color: var(--text-dim); cursor: not-allowed; }
    button.ghost {
      background: transparent; color: var(--text-dim);
      border: 1px solid var(--card-border);
      box-shadow: none;
    }
    button.ghost:hover:not(:disabled) { background: rgba(255,255,255,.06); color: var(--text); }

    .board-wrap {
      position: relative;
      background: var(--board);
      background-image:
        radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px),
        linear-gradient(135deg, var(--board), var(--board-dark));
      background-size: 6px 6px, 100% 100%;
      padding: 18px;
      border-radius: 12px;
      box-shadow:
        0 1px 0 rgba(255,255,255,.4) inset,
        0 -3px 0 rgba(0,0,0,.15) inset,
        0 12px 30px rgba(0,0,0,.4);
      touch-action: none;
    }
    canvas { display: block; cursor: pointer; }

    .stats {
      margin-top: 14px; display: flex; gap: 18px; font-size: 13px; color: var(--text-dim);
    }
    .stats span b { color: var(--text); }

    footer {
      margin-top: 20px; font-size: 12px; color: var(--text-dim);
    }
    footer a { color: var(--text-dim); text-decoration: none; border-bottom: 1px dashed rgba(255,255,255,.25); }

    /* ===== 联机对战 ===== */
    .online-panel {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 14px; font-size: 13px;
    }
    .online-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: var(--card-bg); border: 1px solid var(--card-border);
    }
    .online-status .led {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    }
    .online-status.ready .led { background: var(--ready); }
    .my-color-tag {
      padding: 6px 12px; border-radius: 999px;
      background: var(--card-bg); border: 1px solid var(--card-border);
    }
    .waiting-mask {
      position: absolute; inset: 0; z-index: 5;
      background: rgba(15,15,26,.55);
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 14px; color: var(--text);
      border-radius: 12px;
    }
    .waiting-mask.hide { display: none; }

    @media (max-width: 480px) {
      h1 { font-size: 22px; }
      .board-wrap { padding: 12px; border-radius: 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar"><a id="backLink" class="back-btn" href="../index.html" aria-label="返回网站首页">←</a></div>
    <h1>五 子 棋</h1>
    <div class="subtitle">联机对战 · 15×15 · 无禁手</div>

    <div class="online-panel">
      <div id="onlineStatus" class="online-status"><span class="led"></span><span id="onlineStatusText">连接中...</span></div>
      <div id="myColorTag" class="my-color-tag" style="display:none;"></div>
      <button id="copyLinkBtn" class="ghost">复制邀请链接</button>
    </div>

    <div class="panel">
      <div id="turn" class="turn"><span class="dot"></span><span id="turnText">黑方落子</span></div>
      <button id="undoBtn">悔棋</button>
      <button id="restartBtn" class="ghost">重新开始</button>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="600" height="600"></canvas>
      <div id="waitingMask" class="waiting-mask">等待对手加入房间…<br/>把上方"复制邀请链接"发给对方即可开始</div>
    </div>

    <div class="stats">
      <span>步数：<b id="moveCount">0</b></span>
      <span>黑胜：<b id="blackWin">0</b></span>
      <span>白胜：<b id="whiteWin">0</b></span>
    </div>

    <footer>参考 <a href="offline.html" target="_blank" rel="noreferrer">五子棋</a> 自制本地版</footer>
  </div>

<script>
(() => {
  // ===== 配置 =====
  const N = 15;                // 棋盘 15x15
  const PADDING = 24;          // 画布内边距（线到画布边的距离）
  const STAR_POINTS = [        // 5 个星位（标准位置）
    [3,3],[3,11],[7,7],[11,3],[11,11]
  ];

  // ===== DOM =====
  const canvas   = document.getElementById('board');
  const ctx      = canvas.getContext('2d');
  const turnEl   = document.getElementById('turn');
  const turnText = document.getElementById('turnText');
  const undoBtn  = document.getElementById('undoBtn');
  const restartBtn = document.getElementById('restartBtn');
  const moveCountEl = document.getElementById('moveCount');
  const blackWinEl  = document.getElementById('blackWin');
  const whiteWinEl  = document.getElementById('whiteWin');
  const onlineStatusEl = document.getElementById('onlineStatus');
  const onlineStatusTextEl = document.getElementById('onlineStatusText');
  const myColorTagEl = document.getElementById('myColorTag');
  const copyLinkBtn = document.getElementById('copyLinkBtn');
  const waitingMaskEl = document.getElementById('waitingMask');

  // ===== HiDPI 自适应 + 响应式尺寸 =====
  let cssSize = 600;          // CSS 像素尺寸
  let cell = 0;               // 每格像素

  function fitSize() {
    // 留 32px 边距给容器，最大 600
    const maxW = Math.min(600, window.innerWidth - 80);
    cssSize = Math.max(320, Math.floor(maxW));
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width  = cssSize + 'px';
    canvas.style.height = cssSize + 'px';
    canvas.width  = cssSize * dpr;
    canvas.height = cssSize * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = (cssSize - PADDING * 2) / (N - 1);
    draw();
  }

  // ===== 状态 =====
  // grid[y][x]: 0 空, 1 黑, 2 白
  let grid, history, current, winner, winLine, hover, score = { 1:0, 2:0 };

  function newGame() {
    grid = Array.from({length: N}, () => new Array(N).fill(0));
    history = [];      // [{x,y,c}]
    current = 1;       // 黑先
    winner = 0;
    winLine = null;
    hover = null;
    updateUI();
    draw();
  }

  // ===== 联机对战 =====
  // 服务器只做房间管理和消息转发，不做棋局裁决；
  // 双方浏览器各自跑同一套上面的规则代码，靠"收到同样的消息序列"来保持棋局同步。
  const params = new URLSearchParams(location.search);
  let roomCode = params.get('room');
  if (!roomCode) {
    roomCode = Math.random().toString(36).slice(2, 8).toUpperCase();
    params.set('room', roomCode);
    history_replaceUrl();
  }
  function history_replaceUrl() {
    const url = location.pathname + '?' + params.toString();
    window.history.replaceState(null, '', url);
  }

  let ws = null;
  let myColor = 0;        // 服务器分配：1黑 2白，0=未分配
  let wsConnected = false;
  let opponentPresent = false;
  let reconnectTimer = null;

  function wsUrl() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    return `${proto}://${location.host}/gobang-ws/`;
  }

  function connectWS() {
    ws = new WebSocket(wsUrl());
    ws.onopen = () => {
      sendMsg({ type: 'join', room: roomCode });
    };
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      handleServerMessage(msg);
    };
    ws.onclose = () => {
      wsConnected = false;
      opponentPresent = false;
      updateOnlineUI();
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectWS, 2000);
    };
    ws.onerror = () => { /* onclose 会接着触发，这里不用重复处理 */ };
  }

  function sendMsg(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  function handleServerMessage(msg) {
    switch (msg.type) {
      case 'joined':
        myColor = msg.color;
        wsConnected = true;
        opponentPresent = !!msg.opponentPresent;
        break;
      case 'full':
        wsConnected = false;
        alert('房间已满（已有两位玩家），换一个房间链接再试');
        break;
      case 'opponent_joined':
        opponentPresent = true;
        break;
      case 'opponent_left':
        opponentPresent = false;
        break;
      case 'move':
        // 收到的落子消息一定是对手下的，用固定的“对手颜色”而不是本地 current，
        // 避免本地悔棋已经改变 current 之后，把对手的棋子误画成己方颜色（见 doUndo 附近注释）
        place(msg.x, msg.y, 3 - myColor);
        break;
      case 'undo':
        doUndo(msg);
        break;
      case 'restart':
        newGame();
        break;
    }
    updateOnlineUI();
    draw();
  }

  // 本地点击落子：先校验轮次和连接状态，成功后再广播给对方
  function attemptLocalMove(x, y) {
    if (winner) return;
    if (!wsConnected || !opponentPresent) return;
    if (myColor !== current) return;
    if (grid[y][x] !== 0) return;
    place(x, y, myColor);
    sendMsg({ type: 'move', x, y });
  }

  // 悔棋：target 为空表示“撤销我自己刚下的最后一步”（本地点击悔棋按钮触发，
  // 此时 history 末尾必然就是那一步，见 canUndo 的校验，不存在歧义）；
  // target 不为空表示“收到对方发来的撤销通知，撤销的是 target 描述的那一步”。
  //
  // 之所以不能像本地场景那样简单“pop 最后一条”：假如 A 悔棋的同时 B 也正好落了一子
  // （两条消息在网络上交叉传输），等 A 的 undo 消息到达 B 时，B 的 history 末尾已经是
  // B 自己刚下的那一步，不再是 A 想撤销的那一步——必须按坐标+颜色精确定位再删除，
  // 否则会撤错棋子，导致双方棋盘从此永久分叉（对应联机悔棋后两端不一致的问题）。
  function doUndo(target) {
    if (!history.length || winner) return;
    let idx = history.length - 1;
    if (target) {
      idx = history.findIndex(h => h.x === target.x && h.y === target.y && h.c === target.c);
      if (idx === -1) return; // 目标那一步已不存在（可能已被处理过），什么都不做，避免误删
    }
    const [removed] = history.splice(idx, 1);
    grid[removed.y][removed.x] = 0;
    // 不能直接“轮到 removed 的作者”：如果撤销的不是最后一步（上面提到的竞态场景），
    // 正确做法是顺着“剩下的最后一步”继续推算轮次，而不是跳回被撤销那一步的作者
    current = history.length ? 3 - history[history.length - 1].c : 1;
    winner = 0; winLine = null;
    updateUI(); draw();
  }

  function updateOnlineUI() {
    const ready = wsConnected && opponentPresent;
    onlineStatusEl.classList.toggle('ready', ready);
    if (!wsConnected) {
      onlineStatusTextEl.textContent = '连接中...';
    } else if (!opponentPresent) {
      onlineStatusTextEl.textContent = '等待对手加入';
    } else {
      onlineStatusTextEl.textContent = '已连接，对战中';
    }

    if (myColor) {
      myColorTagEl.style.display = '';
      myColorTagEl.textContent = '我是：' + (myColor === 1 ? '黑方' : '白方');
    }

    waitingMaskEl.classList.toggle('hide', ready);
  }

  copyLinkBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(location.href).then(() => {
      copyLinkBtn.textContent = '已复制！';
      setTimeout(() => { copyLinkBtn.textContent = '复制邀请链接'; }, 1500);
    }).catch(() => {
      alert('复制失败，请手动复制地址栏链接发给对方');
    });
  });

  // ===== 绘制 =====
  function draw() {
    ctx.clearRect(0, 0, cssSize, cssSize);

    // 棋盘格线
    ctx.strokeStyle = 'rgba(0,0,0,.75)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const p = PADDING + i * cell;
      // 横线
      ctx.moveTo(PADDING, p); ctx.lineTo(PADDING + (N - 1) * cell, p);
      // 竖线
      ctx.moveTo(p, PADDING); ctx.lineTo(p, PADDING + (N - 1) * cell);
    }
    ctx.stroke();

    // 边框加粗
    ctx.lineWidth = 2;
    ctx.strokeRect(PADDING - 0.5, PADDING - 0.5,
                   (N - 1) * cell + 1, (N - 1) * cell + 1);

    // 星位
    ctx.fillStyle = 'rgba(0,0,0,.85)';
    for (const [sx, sy] of STAR_POINTS) {
      const cx = PADDING + sx * cell, cy = PADDING + sy * cell;
      ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2); ctx.fill();
    }

    // 悬停十字预览
    if (!winner && hover) {
      const { x, y } = hover;
      if (grid[y][x] === 0) {
        const cx = PADDING + x * cell, cy = PADDING + y * cell;
        ctx.save();
        ctx.strokeStyle = current === 1 ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.7)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(PADDING, cy); ctx.lineTo(PADDING + (N - 1) * cell, cy);
        ctx.moveTo(cx, PADDING); ctx.lineTo(cx, PADDING + (N - 1) * cell);
        ctx.stroke();
        ctx.restore();

        // 半透明子
        drawStone(cx, cy, current, 0.45);
      }
    }

    // 棋子
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (grid[y][x] !== 0) {
          const cx = PADDING + x * cell, cy = PADDING + y * cell;
          drawStone(cx, cy, grid[y][x], 1);
        }
      }
    }

    // 最后一手高亮
    if (history.length && !winLine) {
      const last = history[history.length - 1];
      const cx = PADDING + last.x * cell, cy = PADDING + last.y * cell;
      ctx.fillStyle = '#c0392b';
      ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, Math.PI * 2); ctx.fill();
    }

    // 胜利连线高亮
    if (winLine) {
      ctx.save();
      ctx.strokeStyle = 'rgba(192,57,43,.95)';
      ctx.lineWidth = 3;
      const [a, b] = [winLine[0], winLine[winLine.length - 1]];
      ctx.beginPath();
      ctx.moveTo(PADDING + a.x * cell, PADDING + a.y * cell);
      ctx.lineTo(PADDING + b.x * cell, PADDING + b.y * cell);
      ctx.stroke();
      // 五个红点
      ctx.fillStyle = 'rgba(192,57,43,.95)';
      for (const p of winLine) {
        ctx.beginPath();
        ctx.arc(PADDING + p.x * cell, PADDING + p.y * cell, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawStone(cx, cy, color, alpha = 1) {
    const r = cell * 0.42;
    ctx.save();
    ctx.globalAlpha = alpha;
    // 阴影
    ctx.shadowColor = 'rgba(0,0,0,.35)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 1.5;
    // 渐变
    const grd = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1,
                                          cx, cy, r);
    if (color === 1) {
      grd.addColorStop(0, '#777');
      grd.addColorStop(1, '#000');
    } else {
      grd.addColorStop(0, '#fff');
      grd.addColorStop(1, '#bdbdbd');
    }
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ===== 交互 =====
  function pixelToCell(px, py) {
    const x = Math.round((px - PADDING) / cell);
    const y = Math.round((py - PADDING) / cell);
    if (x < 0 || x >= N || y < 0 || y >= N) return null;
    // 距离过远不命中（避免棋盘外边缘附近误触）
    const dx = px - (PADDING + x * cell);
    const dy = py - (PADDING + y * cell);
    if (Math.hypot(dx, dy) > cell * 0.5) return null;
    return { x, y };
  }

  function getMousePos(ev) {
    const rect = canvas.getBoundingClientRect();
    const t = ev.touches ? ev.touches[0] : ev;
    return { px: t.clientX - rect.left, py: t.clientY - rect.top };
  }

  canvas.addEventListener('mousemove', (e) => {
    if (winner) { hover = null; draw(); return; }
    const { px, py } = getMousePos(e);
    const c = pixelToCell(px, py);
    if (!c) { if (hover) { hover = null; draw(); } return; }
    if (!hover || hover.x !== c.x || hover.y !== c.y) {
      hover = c; draw();
    }
  });
  canvas.addEventListener('mouseleave', () => { hover = null; draw(); });

  canvas.addEventListener('click', (e) => {
    if (winner) return;
    const { px, py } = getMousePos(e);
    const c = pixelToCell(px, py);
    if (!c) return;
    attemptLocalMove(c.x, c.y);
  });

  // 触屏：tap 落子
  canvas.addEventListener('touchstart', (e) => {
    if (winner) return;
    e.preventDefault();
    const { px, py } = getMousePos(e);
    const c = pixelToCell(px, py);
    if (c) attemptLocalMove(c.x, c.y);
  }, { passive: false });

  // forcedColor：显式指定这颗棋子是谁下的。本地点击时传 myColor，
  // 处理远端 'move' 消息时传 3-myColor（对手颜色是固定值，不受本地 current
  // 被悔棋改写的影响）——不再用可能已经过期/被污染的本地 current 兜底猜颜色。
  function place(x, y, forcedColor) {
    if (grid[y][x] !== 0) return;
    const color = forcedColor || current;
    grid[y][x] = color;
    history.push({ x, y, c: color });

    const line = checkWin(x, y, color);
    if (line) {
      winner = color;
      winLine = line;
      score[winner] += 1;
    } else if (history.length === N * N) {
      winner = -1; // 平局
    } else {
      current = color === 1 ? 2 : 1;
    }
    hover = null;
    updateUI();
    draw();
  }

  // 检查 (x,y) 落子后是否连成 5
  function checkWin(x, y, c) {
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (const [dx, dy] of dirs) {
      const line = [{x, y}];
      // 正向
      for (let k = 1; k < 5; k++) {
        const nx = x + dx * k, ny = y + dy * k;
        if (nx<0||nx>=N||ny<0||ny>=N||grid[ny][nx]!==c) break;
        line.push({ x: nx, y: ny });
      }
      // 反向
      for (let k = 1; k < 5; k++) {
        const nx = x - dx * k, ny = y - dy * k;
        if (nx<0||nx>=N||ny<0||ny>=N||grid[ny][nx]!==c) break;
        line.unshift({ x: nx, y: ny });
      }
      if (line.length >= 5) {
        // 取连续的 5 子（包含落点的）
        // 找包含 (x,y) 的最长连续段，再截前 5
        // 因为我们就是从落点向两侧扩，line 已经是连续的
        // 这里返回前 5 个即可（>=5 时取首段 5 个）
        // 为美观，定位到包含 (x,y) 的窗口
        const idx = line.findIndex(p => p.x === x && p.y === y);
        const start = Math.max(0, Math.min(line.length - 5, idx - 2));
        return line.slice(start, start + 5);
      }
    }
    return null;
  }

  // ===== UI =====
  // 只允许悔棋的场景：棋盘上至少有一步棋、游戏未结束，
  // 且最后一步棋是"我自己"下的（不能撤销对方的棋）
  function canUndo() {
    return history.length > 0 && !winner &&
      !!myColor && history[history.length - 1].c === myColor;
  }

  function updateUI() {
    moveCountEl.textContent = history.length;
    blackWinEl.textContent  = score[1];
    whiteWinEl.textContent  = score[2];
    undoBtn.disabled = !canUndo();

    turnEl.classList.remove('white','win');
    if (winner === -1) {
      turnEl.classList.add('win');
      turnText.textContent = '平局！';
    } else if (winner) {
      turnEl.classList.add('win');
      turnText.textContent = (winner === 1 ? '黑方' : '白方') + ' 获胜！';
    } else {
      if (current === 2) turnEl.classList.add('white');
      turnText.textContent = (current === 1 ? '黑方' : '白方') + ' 落子';
    }
  }

  undoBtn.addEventListener('click', () => {
    if (!canUndo()) return;
    // 必须在 doUndo() 之前取出目标（doUndo 会把它从 history 里删掉），
    // 把坐标+颜色一起发给对方，让对方能精确定位这一步，而不是猜"最后一条"
    const target = history[history.length - 1];
    doUndo();
    sendMsg({ type: 'undo', x: target.x, y: target.y, c: target.c });
  });

  restartBtn.addEventListener('click', () => {
    if (history.length && !winner) {
      if (!confirm('对局尚未结束，确定重新开始？')) return;
    }
    newGame();
    sendMsg({ type: 'restart' });
  });

  // 键盘快捷键：Z 悔棋, R 重开
  window.addEventListener('keydown', (e) => {
    if (e.key === 'z' || e.key === 'Z') undoBtn.click();
    else if (e.key === 'r' || e.key === 'R') restartBtn.click();
  });

  window.addEventListener('resize', fitSize);

  // 仅供自动化测试使用：暴露内部状态与关键入口，绕开真实 WebSocket 时序，
  // 可以确定性地构造"悔棋与对手来子交叉"这类竞态场景（真实网络时序不可控，无法稳定复现）。
  window.gomokuTest = {
    snapshot: () => ({
      stones: history.map(h => ({ x: h.x, y: h.y, c: h.c })),
      current, winner, myColor, wsConnected, opponentPresent,
    }),
    // 跳过真实的 join 流程，直接把本地状态设成"已连接、对手在线、我是某个颜色"
    setConnected(color) { myColor = color; wsConnected = true; opponentPresent = true; updateOnlineUI(); draw(); },
    localMove: (x, y) => attemptLocalMove(x, y),
    clickUndo: () => undoBtn.click(),
    clickRestart: () => restartBtn.click(),
    // 模拟"收到服务器转发的消息"，不依赖真实网络到达顺序，可用来精确摆出竞态时序
    receive: (msg) => handleServerMessage(msg),
  };

  // 启动
  newGame();
  fitSize();
  updateOnlineUI();
  connectWS();
})();
</script>
</body>
</html>
